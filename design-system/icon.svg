<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Sunset Ticker icon</title>
  <defs>
    <linearGradient id="ic-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0720"/><stop offset=".55" stop-color="#3b1167"/><stop offset="1" stop-color="#c2287f"/>
    </linearGradient>
    <linearGradient id="ic-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd15c"/><stop offset=".5" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="ic-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19e3d0"/><stop offset="1" stop-color="#19e3d0"/>
    </linearGradient>
    <!-- slats cut into the lower half of the sun -->
    <mask id="ic-slats">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="0" y="268" width="512" height="9" fill="#000"/>
      <rect x="0" y="296" width="512" height="14" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#ic-bg)"/>
  <g mask="url(#ic-slats)"><circle cx="256" cy="236" r="146" fill="url(#ic-sun)"/></g>
  <!-- the single slide, in front of the sun -->
  <rect x="86" y="268" width="340" height="191" rx="20" fill="#0a0720" stroke="url(#ic-rim)" stroke-width="10"/>
  <rect x="122" y="306" width="150" height="16" rx="8" fill="#ff2e88"/>
  <rect x="122" y="338" width="230" height="12" rx="6" fill="#ff8a3d" opacity=".85"/>
  <rect x="122" y="364" width="190" height="12" rx="6" fill="#ffd15c" opacity=".7"/>
  <circle cx="380" cy="420" r="9" fill="#3dff8b"/>
</svg>
